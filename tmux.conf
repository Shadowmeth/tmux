# Set the prefix from C-b to backtick
set -g prefix `

# Ensure that we can send ` to other apps
bind ` send-prefix

# Free the original C-b prefix keybinding
unbind C-b

# Set the delay between prefix and command
set -s escape-time 10

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
set -w -g pane-base-index 1

set -g repeat-time 200
set -g focus-events off

# Reload the file with Prefix r
bind r \
  source-file ~/.config/tmux/tmux.conf \; \
  display-message "Configuration reloaded"

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Pane resizing with Prefix H,J,K,L
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Enable mouse copying and scrolling
set -g mouse on

# Use 24 bit colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Pane border style: single, double, heavy, simple, number
set -w -g pane-border-lines heavy

# Enable vi keys
set -w -g mode-keys vi

# Send copies to the system clipboard through kitty
set -g set-clipboard on

# prefix + v enters copy mode
bind v copy-mode

# In copy mode: v starts selection, y copies and exits
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Prefix + l to clear the screen
bind l send-keys 'C-l'

# By default Prefix + l moves to the last window.
# Since we remapped it to clear the screen, map Prefix + Tab
# to move to last window.
bind Tab last-window

# Theme: Vesper colours (same palette as vesper.nvim)
set -g status-style "bg=default,fg=#A0A0A0"

set -g status-left "#[fg=#101010,bg=#FFC799,bold] #S #[default] "
set -g status-left-length 30

# Disable the date, time and hostname on right of status bar
set -g status-right ""

set -g window-status-format "#[fg=#65737E] #I:#W "
set -g window-status-current-format "#[fg=#FFC799,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#232323"
set -g pane-active-border-style "fg=#505050"

set -g message-style "bg=#232323,fg=#FFC799"
set -g message-command-style "bg=#232323,fg=#FFC799"
set -g mode-style "bg=#FFE3C7,fg=#101010"
set -g copy-mode-selection-style "bg=#FFE3C7,fg=#101010"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# NOTE: Should be the last line
run '~/.tmux/plugins/tpm/tpm'
